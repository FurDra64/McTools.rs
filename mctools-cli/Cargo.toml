[package]
name = "mctools-cli"
version = "0.1.0"
edition = "2021"
description = "McTools CLI - Decrypt and encrypt Minecraft Bedrock marketplace content"

[dependencies]
mctools-lib = { path = "../mctools-lib" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2", default-features = false }
