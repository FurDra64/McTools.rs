[package]
name = "mctools-lib"
version = "0.1.0"
edition = "2021"
description = "Minecraft Bedrock marketplace content encryption/decryption library"

[features]
default = ["native"]
native = ["zip"]

[dependencies]
aes = "0.8"
cipher = "0.4"
sha2 = "0.10"
base64 = "0.22"
fastrand = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", optional = true }
thiserror = "2"
