<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>McTools — Persona Encryptor</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #e94560;
  --accent-hover: #ff6b81;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;line-height:1.5
}
.container{max-width:720px;margin:0 auto;padding:24px 16px}

/* Header */
header{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px}
header h1{font-size:1.1rem;font-weight:600}
header span{color:var(--text-dim);font-size:.82rem}

/* Drop zone */
.drop-zone{
  border:2px dashed var(--border);border-radius:6px;padding:32px 20px;
  text-align:center;cursor:pointer;transition:border-color .2s,background .2s;
  position:relative
}
.drop-zone.dragover{border-color:var(--accent);background:#1a1a2e}
.drop-zone.has-file{border-style:solid;border-color:var(--border);padding:12px 16px}
.drop-zone .icon{font-size:2rem;margin-bottom:6px}
.drop-zone .label{font-size:.9rem;color:var(--text-dim)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Error */
.error{display:none;background:#2d1215;border:1px solid #4a2025;border-radius:6px;padding:10px 14px;margin:12px 0;font-size:.85rem;white-space:pre-wrap;word-break:break-all}
.error.active{display:block}
.error.success{background:#0e2b1c;border:1px solid #1c5a33}

/* File tree */
.file-tree{display:none;margin-top:16px}
.file-tree.active{display:block}

.tree-row{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;
  cursor:default;font-size:.85rem;transition:background .15s
}
.tree-row:hover{background:var(--surface)}
.tree-row .icon{flex-shrink:0;width:18px;text-align:center;font-size:.75rem;opacity:.7}
.tree-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .size{color:var(--text-dim);font-size:.75rem;flex-shrink:0}
.tree-row .arrow{
  flex-shrink:0;width:14px;text-align:center;font-size:.65rem;
  color:var(--text-dim);transition:transform .15s;user-select:none
}
.tree-row.dir{cursor:pointer}
.tree-row.dir .arrow{display:inline}
.tree-children{padding-left:20px;display:none}
.tree-children.open{display:block}

/* File count badge */
.file-count{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 10px;background:var(--surface);border-radius:6px;font-size:.8rem;color:var(--text-dim)}
.file-count span{color:var(--text)}

/* Spinner */
.spinner{display:none;text-align:center;padding:32px}
.spinner.active{display:block}
.spinner-inner{
  width:28px;height:28px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 10px
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner .msg{font-size:.85rem;color:var(--text-dim)}

/* Save bar */
.save-bar{display:none;position:sticky;bottom:0;padding:12px 0;background:var(--bg)}
.save-bar.active{display:flex;flex-direction:column;gap:8px}
.save-bar button{
  width:100%;padding:12px;
  background:var(--accent);color:#fff;border:none;border-radius:6px;
  font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .15s
}
.save-bar button:disabled{opacity:.4;cursor:not-allowed}
.save-bar button:not(:disabled):active{opacity:.8}
.save-bar .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);font-weight:600}
.save-bar .btn-secondary:not(:disabled):active{opacity:.8}
.save-bar .btn-text{background:transparent;border:none;color:var(--text-dim);font-size:.8rem;font-weight:500}
.save-bar .btn-text:not(:disabled):hover{color:var(--accent)}
.save-bar .btn-text:disabled{opacity:.4;cursor:not-allowed}

/* Debug panel (iOS Safari + File Picker extension diagnostics) */
.debug-panel{margin-top:24px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.debug-header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;font-size:.85rem;font-weight:600}
.debug-header .arrow{font-size:.65rem;color:var(--text-dim);transition:transform .15s}
.debug-panel.open .debug-header .arrow{transform:rotate(90deg)}
.debug-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.debug-panel.open .debug-body{display:block}
.debug-body h3{font-size:.8rem;color:var(--text-dim);margin:12px 0 6px;font-weight:600}
.debug-actions{display:flex;gap:8px;flex-wrap:wrap}
.debug-actions button{
  padding:7px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-size:.8rem;cursor:pointer;transition:border-color .15s,color .15s
}
.debug-actions button:hover{border-color:var(--accent);color:var(--accent)}
.debug-actions button:disabled{opacity:.4;cursor:not-allowed}
.diag-list{margin:0;padding:0;list-style:none;font-size:.8rem;display:grid;gap:2px}
.diag-list li{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.diag-list .status{flex-shrink:0;width:16px;text-align:center;font-weight:700}
.diag-list .ok{color:#3fb950}
.diag-list .ng{color:#f85149}
.diag-list .key{color:var(--text-dim);min-width:220px}
.diag-hint{font-size:.75rem;color:var(--text-dim);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:10px;line-height:1.6}
.test-log{margin:10px 0 0;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;white-space:pre-wrap;word-break:break-all;min-height:60px;max-height:240px;overflow:auto;color:var(--text)}
</style>
</head>
<body>
<div class="container">
  <header><h1>🧊 McTools</h1><span>Persona Encryptor</span></header>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".zip,.mcpack">
    <div class="icon">📦</div>
    <div class="label">Select a skin pack zip</div>
  </div>

  <div class="error" id="error"><div id="errorMsg"></div></div>

  <div class="spinner" id="spinner">
    <div class="spinner-inner"></div>
    <div class="msg" id="spinnerMsg">Processing…</div>
  </div>

  <div class="file-tree" id="fileTree">
    <div class="file-count">📁 <span id="fileCount">0</span> files</div>
    <div id="treeRoot"></div>
  </div>

  <div class="save-bar" id="saveBar">
    <button id="saveBtn" disabled>🔒 Encrypt & Download</button>
    <button id="saveMinecraftBtn" class="btn-secondary" disabled>📁 Save to Minecraft (premium_cache)</button>
    <button id="saveManualBtn" class="btn-text" disabled>💾 フォルダを選んで手動保存</button>
  </div>

  <!-- Debug panel: iOS Safari + File Picker extension (File System Access API) diagnostics -->
  <div class="debug-panel" id="debugPanel">
    <div class="debug-header" id="debugHeader">
      <span class="arrow">▶</span>🛠 ファイルピッカーデバッグ
    </div>
    <div class="debug-body">
      <h3>診断 — 利用可能なファイル API</h3>
      <div class="debug-actions">
        <button id="diagBtn">🔍 診断を実行</button>
      </div>
      <ul class="diag-list" id="diagList"></ul>
      <div class="debug-actions" style="margin-top:12px">
        <button id="testOpenBtn">📂 開くテスト</button>
        <button id="testSaveBtn">💾 保存テスト</button>
      </div>
      <pre class="test-log" id="testLog"></pre>
    </div>
  </div>
</div>

<script type="module">
import init, * as mctools from './mctools_wasm.js';
import JSZip from 'https://esm.sh/jszip@3.10.1';

const HARDCODED_KEY = 's5s5ejuDru4uchuF2drUFuthaspAbepE';
// Must match C# McCrypt.Marketplace.dontEncrypt exactly
const DONT_ENCRYPT = new Set(['manifest.json', 'contents.json', 'texts', 'pack_icon.png']);

function shouldEncrypt(relPath) {
  for (const part of relPath.split('/')) {
    if (DONT_ENCRYPT.has(part)) return false;
  }
  return true;
}

const $ = id => document.getElementById(id);
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const errorDiv = $('error');
const errorMsg = $('errorMsg');
const spinner = $('spinner');
const spinnerMsg = $('spinnerMsg');
const fileTree = $('fileTree');
const treeRoot = $('treeRoot');
const fileCount = $('fileCount');
const saveBar = $('saveBar');
const saveBtn = $('saveBtn');
const saveMinecraftBtn = $('saveMinecraftBtn');
const saveManualBtn = $('saveManualBtn');

let state = { files: [], baseDir: '' };

function showError(msg) { errorMsg.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg); errorDiv.classList.add('active'); }
function showSuccess(msg) { errorMsg.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg); errorDiv.classList.add('active', 'success'); }
function hideError() { errorDiv.classList.remove('active', 'success'); }
function showSpinner(msg) { spinnerMsg.textContent = msg; spinner.classList.add('active'); }
function hideSpinner() { spinner.classList.remove('active'); }
function bytesToStr(b) { return new TextDecoder().decode(b); }
function strToBytes(s) { return new TextEncoder().encode(s); }
function formatSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB'; }

function generateKey() {
  const c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890';
  const r = crypto.getRandomValues(new Uint8Array(32));
  let k = '';
  for (let i = 0; i < 32; i++) k += c[r[i] % c.length];
  return k;
}

// ---- Tree building ----
function buildTree(files) {
  const root = { name: '', children: {}, files: [] };
  for (const f of files) {
    const parts = f.path.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node.children[parts[i]]) node.children[parts[i]] = { name: parts[i], children: {}, files: [] };
      node = node.children[parts[i]];
    }
    node.files.push(f);
  }
  return root;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderTree(node, container) {
  const keys = Object.keys(node.children).sort();
  for (const k of keys) {
    const child = node.children[k];
    const dirDiv = document.createElement('div');
    dirDiv.innerHTML = `<div class="tree-row dir"><span class="arrow">▶</span><span class="icon">📁</span><span class="name">${esc(k)}</span></div><div class="tree-children"></div>`;
    const row = dirDiv.querySelector('.tree-row');
    const childrenDiv = dirDiv.querySelector('.tree-children');
    row.onclick = () => {
      childrenDiv.classList.toggle('open');
      row.querySelector('.arrow').style.transform = childrenDiv.classList.contains('open') ? 'rotate(90deg)' : '';
    };
    container.appendChild(dirDiv);
    renderTree(child, childrenDiv);
  }
  const sortedFiles = [...node.files].sort((a, b) => a.path.localeCompare(b.path));
  for (const f of sortedFiles) {
    const icon = f.path.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄';
    const row = document.createElement('div');
    row.className = 'tree-row';
    row.innerHTML = `<span class="arrow"></span><span class="icon">${icon}</span><span class="name">${esc(f.name)}</span><span class="size">${formatSize(f.data.length)}</span>`;
    container.appendChild(row);
  }
}

// ---- Load zip ----
async function loadZip(file) {
  if (!file.name.match(/\.(zip|mcpack)$/i)) { showError('Select a .zip or .mcpack file'); return; }
  dropZone.classList.add('has-file');
  dropZone.querySelector('.label').textContent = file.name;
  hideError();
  showSpinner('Reading zip…');
  try {
    await init();
    const zipData = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(zipData);
    const loaded = [];
    zip.forEach((p, e) => { if (!e.dir) loaded.push({ path: p, entry: e }); });
    const files = [];
    for (const item of loaded) {
      files.push({ path: item.path, data: new Uint8Array(await item.entry.async('arraybuffer')), name: item.path.split('/').pop() || item.path });
    }

    // Determine base dir (where manifest.json lives)
    const mf = files.find(f => f.path.endsWith('manifest.json'));
    state.baseDir = mf ? mf.path.slice(0, mf.path.lastIndexOf('/') + 1) : '';
    state.files = files;

    hideSpinner();
    renderTreeView(files);
  } catch (e) { hideSpinner(); showError(e.message || String(e)); console.error(e); }
}

// ---- Render tree ----
function renderTreeView(files) {
  fileCount.textContent = files.length;
  const root = buildTree(files);
  treeRoot.innerHTML = '';
  renderTree(root, treeRoot);
  // Auto-open the single top-level directory (common case)
  const firstContainer = treeRoot.querySelector(':scope > div:first-child');
  const firstDir = firstContainer?.querySelector('.tree-children');
  if (firstDir && treeRoot.children.length === 1) {
    firstDir.classList.add('open');
    const arrow = firstContainer.querySelector('.tree-row .arrow');
    if (arrow) arrow.style.transform = 'rotate(90deg)';
  }
  fileTree.classList.add('active');
  saveBar.classList.add('active');
  saveBtn.disabled = false;
  saveMinecraftBtn.disabled = false;
  saveManualBtn.disabled = false;
}

// ---- Encrypt & Save ----
// Build the encrypted McTools pack as a zip.
//   compression: 'STORE' (C# in-place parity, used by the download) or 'DEFLATE' (premium_cache format)
//   flatten:     true writes files at the zip root (manifest.json directly inside), matching the
//                layout the game's own marketplace packs use in premium_cache. false keeps the
//                original wrapper folder like the C# reference output.
async function buildEncryptedZip({ compression = 'STORE', flatten = false } = {}) {
  // Find manifest.json for UUID
  const mf = state.files.find(f => f.path.endsWith('manifest.json'));
  if (!mf) throw new Error('manifest.json not found');
  let uuid;
  try { uuid = JSON.parse(bytesToStr(mf.data)).header?.uuid; } catch(e) {}
  if (!uuid) throw new Error('header.uuid not found in manifest.json');

  const baseDir = state.baseDir;

  // Build a map of relative path → file entry (paths inside content list must be relative like C#)
  const fileMap = new Map();
  for (const f of state.files) {
    const relPath = f.path.startsWith(baseDir) ? f.path.slice(baseDir.length) : f.path;
    fileMap.set(relPath, f);
  }

  // Collect unique directory paths (matches C# GetFileSystemEntries returning directories)
  const dirSet = new Set();
  for (const relPath of fileMap.keys()) {
    const parts = relPath.split('/');
    for (let i = 1; i < parts.length; i++) {
      dirSet.add(parts.slice(0, i).join('/') + '/');
    }
  }

  // Create signatures.json FIRST (C# calls SignManifest before EncryptContents)
  const manifestRelPath = mf.path.startsWith(baseDir) ? mf.path.slice(baseDir.length) : mf.path;
  const manifestHash = mctools.sha256_digest(mf.data);
  const sigB64 = btoa(String.fromCharCode(...manifestHash));
  const sigJsonStr = JSON.stringify([{ hash: sigB64, path: manifestRelPath }]);
  const sigBuf = strToBytes(sigJsonStr);

  // Build content list matching C# behaviour:
  //   - Sort alphabetically for deterministic order
  //   - Directory entries with trailing /, no key
  //   - Files get encrypted or not based on shouldEncrypt(path)
  //   - signatures.json is NOT in DONT_ENCRYPT → gets a key
  const content = [];

  // Collect all relative paths (files + directories), sort for deterministic order
  const allPaths = new Set(fileMap.keys());
  for (const dirPath of dirSet) allPaths.add(dirPath);
  allPaths.add('signatures.json');  // will be signed
  const sortedPaths = [...allPaths].sort();

  for (const relPath of sortedPaths) {
    if (relPath === 'signatures.json') {
      // Signatures.json: generated, encrypt with a random key
      const key = generateKey();
      const enc = mctools.aes256_cfb8_encrypt(strToBytes(key), sigBuf);
      content.push({ path: relPath, key });
      // Store for zip output (keyed by relPath)
      fileMap.set(relPath, { data: sigBuf, _encrypted: enc });
    } else if (dirSet.has(relPath)) {
      // Directory entry: no key, no data
      content.push({ path: relPath });
    } else {
      const f = fileMap.get(relPath);
      if (f && shouldEncrypt(relPath)) {
        const key = generateKey();
        const enc = mctools.aes256_cfb8_encrypt(strToBytes(key), f.data);
        f._encrypted = enc;
        content.push({ path: relPath, key });
      } else if (f) {
        content.push({ path: relPath });
      }
    }
  }

  // Build minified contents.json (must match C# JsonConvert.SerializeObject output)
  const cjStr = JSON.stringify({ version: 1, content });
  const encCj = mctools.aes256_cfb8_encrypt(strToBytes(HARDCODED_KEY), strToBytes(cjStr));
  const finalCj = mctools.build_encrypted_header(uuid, encCj);

  // Build output zip. STORE matches C# in-place encryption; DEFLATE matches the game's premium_cache packs.
  // flatten=true drops the wrapper folder so manifest.json sits at the zip root (game marketplace layout).
  const newZip = new JSZip();
  const prefix = flatten ? '' : baseDir;
  newZip.file(prefix + 'contents.json', new Uint8Array(finalCj));

  // Add all files (including signatures.json now in fileMap)
  for (const [relPath, f] of fileMap) {
    const fpath = prefix + relPath;
    const data = f._encrypted || f.data;
    if (data) newZip.file(fpath, new Uint8Array(data));
  }

  const blob = await newZip.generateAsync({ type: 'blob', compression });
  return { blob, uuid };
}

async function encryptAndDownload() {
  hideError();
  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ Encrypting…';
  try {
    const { blob } = await buildEncryptedZip({ compression: 'STORE', flatten: false });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'persona_encrypted.zip';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    saveBtn.textContent = '✅ Done';
    setTimeout(() => { saveBtn.textContent = '🔒 Encrypt & Download'; saveBtn.disabled = false; }, 2000);
  } catch (e) {
    showError(e.message || String(e));
    saveBtn.textContent = '🔒 Encrypt & Download';
    saveBtn.disabled = false;
  }
}

// ---- Save to Minecraft premium_cache ----
// Writes the encrypted pack straight into premium_cache/skin_packs (the game's marketplace cache).
// Needs File System Access API directory write access (Chrome/Edge, or the iOS "File Picker" extension).
function randomPackName() {
  // The game names premium_cache packs after a base64(8-byte) random id (e.g. "53ggYmmxb+Q=").
  // Match that exactly; only '/' is impossible in a file name, so redraw when it appears.
  let s;
  do {
    const b = crypto.getRandomValues(new Uint8Array(8));
    s = btoa(String.fromCharCode(...b));
  } while (s.includes('/'));
  return s;
}

const MAX_DIR_SCAN = 8000;

// Recursively scan the tree granted by showDirectoryPicker for a directory named skin_packs
// whose parent is premium_cache, so the user can pick any level above it. Returns { handle, path }.
// If the selected root itself is named skin_packs, use it directly (parent isn't visible via the API).
async function findSkinPacks(rootHandle, onProgress) {
  if (rootHandle.name === 'skin_packs') return { handle: rootHandle, path: rootHandle.name };
  const found = [];
  let visited = 0;

  async function walk(dirHandle, pathParts) {
    if (found.length) return;
    if (++visited > MAX_DIR_SCAN) {
      throw new Error('ディレクトリが多すぎます。premium_cache を含む、より狭いフォルダを選択してください');
    }
    if (onProgress && visited % 200 === 0) onProgress(visited);
    let entries;
    try { entries = dirHandle.values(); } catch { return; }
    for await (const entry of entries) {
      if (entry.kind !== 'directory') continue;
      if (entry.name === 'skin_packs' && dirHandle.name === 'premium_cache') {
        found.push({ handle: entry, path: [...pathParts, dirHandle.name, 'skin_packs'].join('/') });
        return;
      }
      await walk(entry, [...pathParts, dirHandle.name]);
    }
  }

  await walk(rootHandle, []);
  return found[0] || null;
}

// Best-effort maintenance of the game's per-directory LRU ledger (.lru.json:
// {"version":1,"entries":[{"id":"<manifest uuid>","last_used_sec":<unix sec>}]}).
// Never fail the whole save on this — the game also falls back to the file mtime.
async function updateLruJson(skinPacksHandle, uuid) {
  try {
    const now = Math.floor(Date.now() / 1000);
    let data = null;
    try {
      const fh = await skinPacksHandle.getFileHandle('.lru.json');
      data = JSON.parse(await (await fh.getFile()).text());
    } catch (e) { /* no .lru.json yet — create it */ }
    const base = (data && typeof data === 'object') ? data : { version: 1 };
    const entries = Array.isArray(base.entries) ? base.entries : [];
    const next = entries.filter(e => e && e.id !== uuid);
    next.push({ id: uuid, last_used_sec: now });
    const fh = await skinPacksHandle.getFileHandle('.lru.json', { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify({ ...base, entries: next }));
    await w.close();
  } catch (e) {
    console.warn('Failed to update .lru.json:', e);
  }
}

async function saveToMinecraft() {
  hideError();
  if (!state.files.length) { showError('先にスキンパック（.zip / .mcpack）を読み込んでください'); return; }

  const secure = isSecureContext;
  const hasDir = 'showDirectoryPicker' in window;
  log('Save to Minecraft: isSecureContext=' + secure + ' showDirectoryPicker=' + hasDir + ' URL=' + location.href);

  if (!hasDir) {
    // Don't silently fall back to a file dialog (that reads as "it wants a file, not a folder").
    // Explain the cause and point to the explicit manual-save button instead.
    showError(
      'フォルダを直接選択できないため、自動保存は使えません。\n\n' +
      (secure
        ? 'このブラウザでは showDirectoryPicker（フォルダ選択 API）が利用できません。\nChrome/Edge、または iOS では App Store の「File Picker」拡張を有効化してください。'
        : 'このページはセキュアでない接続（http の IP アドレス等）で開かれているため、ファイル選択 API が無効です。\nhttps:// または http://localhost で開き直してください。\n現在の URL: ' + location.href) +
      '\n\n「💾 フォルダを選んで手動保存」なら保存先を自分で選べます。'
    );
    return;
  }
  let rootHandle;
  try {
    rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    if (e.name === 'AbortError') return;
    showError('フォルダを開けませんでした: ' + (e.message || e));
    return;
  }
  showSpinner('premium_cache/skin_packs を検索中…');
  try {
    const target = await findSkinPacks(rootHandle, n => {
      spinnerMsg.textContent = 'premium_cache/skin_packs を検索中… (' + n + ' フォルダ)';
    });
    hideSpinner();
    if (!target) {
      showError('選択したフォルダの中に premium_cache/skin_packs が見つかりませんでした。\n「Minecraft Bedrock」や「premium_cache」など、premium_cache を含む階層を選択してください。');
      return;
    }
    showSpinner('暗号化して保存中…');
    const { blob, uuid } = await buildEncryptedZip({ compression: 'DEFLATE', flatten: true });
    const name = randomPackName();
    const fh = await target.handle.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
    await updateLruJson(target.handle, uuid);
    hideSpinner();
    showSuccess('Minecraft に保存しました 📁\n' + target.path + '/' + name + '\n\nMinecraft を再起動するか、更衣室でスキンパックを再読み込みすると反映されます。');
  } catch (e) {
    hideSpinner();
    showError('保存に失敗しました: ' + (e.message || e));
  }
}

// Fallback when showDirectoryPicker is unavailable: the user navigates to the target folder
// with the OS save dialog and confirms the (extensionless) file name. .lru.json cannot be updated here.
async function saveToMinecraftManual() {
  if (!('showSaveFilePicker' in window) || !('FileSystemFileHandle' in window)) {
    showError('このブラウザではファイルの直接保存にも未対応です。Chrome/Edge または iOS の File Picker 拡張でお試しください。');
    return;
  }
  try {
    const { blob } = await buildEncryptedZip({ compression: 'DEFLATE', flatten: true });
    const handle = await window.showSaveFilePicker({ suggestedName: randomPackName() });
    const w = await handle.createWritable();
    await w.write(blob);
    await w.close();
    showSuccess('保存しました。premium_cache/skin_packs 内に保存した場合、Minecraft を再起動して確認してください。');
  } catch (e) {
    if (e.name === 'AbortError') return;
    showError('保存に失敗しました: ' + (e.message || e));
  }
}

// ---- File Picker debug panel (iOS Safari + File Picker extension) ----
// The "File Picker" Safari extension implements the File System Access API,
// so the feature-detection below is the signal that direct read/write works.
const debugPanel = $('debugPanel');
const debugHeader = $('debugHeader');
const diagBtn = $('diagBtn');
const diagList = $('diagList');
const testOpenBtn = $('testOpenBtn');
const testSaveBtn = $('testSaveBtn');
const testLog = $('testLog');

function log(msg) {
  const line = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  testLog.textContent = testLog.textContent ? testLog.textContent + '\n' + line : line;
  testLog.scrollTop = testLog.scrollHeight;
}

function detectApis() {
  const ua = navigator.userAgent;
  const isIPad = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  const isIOS = isIPad || /iPhone|iPod/.test(ua);
  return [
    { key: 'Secure context (HTTPS)', ok: isSecureContext },
    { key: 'window.showOpenFilePicker', ok: 'showOpenFilePicker' in window, note: 'File System Access API — File Picker 拡張 / Chromium' },
    { key: 'window.showSaveFilePicker', ok: 'showSaveFilePicker' in window, note: 'File System Access API の保存ピッカー' },
    { key: 'window.showDirectoryPicker', ok: 'showDirectoryPicker' in window, note: 'ディレクトリ選択 — premium_cache 自動認識に必要' },
    { key: 'FileSystemFileHandle', ok: 'FileSystemFileHandle' in window, note: '書き込みハンドル (createWritable)' },
    { key: 'Platform', ok: true, val: isIOS ? (isIPad ? 'iPadOS' : 'iOS') : (navigator.userAgentData?.platform || ua) },
  ];
}

function runDiagnostics() {
  diagList.innerHTML = '';
  const hasFSAA = 'showSaveFilePicker' in window || 'showOpenFilePicker' in window;
  for (const d of detectApis()) {
    const li = document.createElement('li');
    const status = document.createElement('span');
    status.className = 'status ' + (d.ok ? 'ok' : 'ng');
    status.textContent = d.ok ? '✓' : '✗';
    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = d.key;
    const val = document.createElement('span');
    val.textContent = d.val || (d.ok ? '利用可' : '未対応');
    li.append(status, key, val);
    if (d.note) li.title = d.note;
    diagList.appendChild(li);
  }
  const hint = document.createElement('div');
  hint.className = 'diag-hint';
  hint.textContent = hasFSAA
    ? 'File System Access API が利用可能です。開く/保存テストでローカルファイルに直接読み書きできます。'
    : 'File System Access API はこのブラウザで未対応です。iOS Safari では App Store の「File Picker」アプリをインストールし、このサイトで Safari 拡張を有効化して再読み込みすると使えるようになります。';
  diagList.appendChild(hint);
  log('診断完了。');
}

function isTextLike(file) {
  return file.type.startsWith('text/') || /\.(txt|json|jsonc|md|cfg)$/i.test(file.name);
}

async function describeFile(file) {
  log('選択: ' + file.name + '  size=' + formatSize(file.size) + '  type=' + (file.type || 'n/a'));
  if (isTextLike(file)) {
    try {
      log('内容: ' + (await file.text()).slice(0, 200).replace(/\n/g, '\\n'));
    } catch (err) {
      log('読み込み失敗: ' + (err.message || err));
    }
  }
}

async function testOpenPicker() {
  if (!('showOpenFilePicker' in window)) {
    log('showOpenFilePicker が利用できません。診断を実行して環境を確認してください');
    return;
  }
  log('開くテスト: ピッカーを起動します…');
  try {
    const [handle] = await window.showOpenFilePicker();
    await describeFile(await handle.getFile());
  } catch (e) {
    if (e.name === 'AbortError') log('開くテストはキャンセルされました');
    else log('開くテスト失敗: ' + (e.message || e));
  }
}

async function testSavePicker() {
  if (!('showSaveFilePicker' in window) || !('FileSystemFileHandle' in window)) {
    log('showSaveFilePicker / FileSystemFileHandle が利用できません。診断を実行して環境を確認してください');
    return;
  }
  const payload = 'McTools file-picker debug test\n' + new Date().toISOString() + '\n';
  log('保存テスト: mctools_test.txt を書き込みます…');
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'mctools_test.txt',
      types: [{ description: 'Text file', accept: { 'text/plain': ['.txt'] } }],
    });
    const writable = await handle.createWritable();
    await writable.write(payload);
    await writable.close();  // File Picker persists writes on close
    log('書き込み成功: "' + handle.name + '" に ' + payload.length + ' バイト（close 時に確定）');
  } catch (e) {
    if (e.name === 'AbortError') log('保存テストはキャンセルされました');
    else log('保存テスト失敗: ' + (e.message || e));
  }
}

debugHeader.addEventListener('click', () => debugPanel.classList.toggle('open'));
diagBtn.addEventListener('click', runDiagnostics);
testOpenBtn.addEventListener('click', testOpenPicker);
testSaveBtn.addEventListener('click', testSavePicker);

// ---- Events ----
saveBtn.addEventListener('click', encryptAndDownload);
saveMinecraftBtn.addEventListener('click', saveToMinecraft);
saveManualBtn.addEventListener('click', saveToMinecraftManual);
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadZip(e.target.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadZip(e.dataTransfer.files[0]);
});
console.log('McTools ready');
</script>
</body>
